# Diagnostic probe: does the TrueAPI ingest Worker serve the exact routes
# src/scripts/data-sources.js requests? Read-only GETs against a public
# endpoint, no secrets. Throwaway — this branch is not for merge.
name: Ingest probe

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Probe the three dataset routes
        run: |
          set +e
          BASE="https://ingest.oakandmain.dev/data/cdc-socrata/resource"
          probe () {
            local id="$1" lim="$2" label="$3"
            local url="$BASE/$id.json?\$limit=$lim&\$order=week_end+DESC"
            echo "==================================================================="
            echo "### $label"
            echo "### $url"
            curl -sS -o /tmp/body.json -D /tmp/head.txt \
                 -w "HTTP %{http_code} | %{content_type} | %{size_download} bytes | %{time_total}s\n" \
                 -H 'Accept: application/json' \
                 --max-time 45 "$url"
            echo "--- response headers ---"
            cat /tmp/head.txt 2>/dev/null | head -25
            echo "--- body, first 700 bytes ---"
            head -c 700 /tmp/body.json 2>/dev/null; echo
            echo "--- shape ---"
            node -e '
              const fs=require("fs");
              let raw; try { raw=fs.readFileSync("/tmp/body.json","utf8"); } catch { console.log("  (no body)"); process.exit(0); }
              let j; try { j=JSON.parse(raw); } catch(e) { console.log("  NOT JSON:", e.message); process.exit(0); }
              if (Array.isArray(j)) {
                console.log("  bare array of", j.length, "rows");
                if (j[0]) console.log("  row0 keys:", Object.keys(j[0]).join(", "));
                if (j[0]) console.log("  row0:", JSON.stringify(j[0]).slice(0,400));
              } else if (j && typeof j==="object") {
                console.log("  object, top-level keys:", Object.keys(j).join(", "));
                console.log("  envelope {api,data,fetchedAt,stale}:", ["api","data","fetchedAt","stale"].every(k=>k in j));
                if (j.fetchedAt) console.log("  fetchedAt:", j.fetchedAt, "| stale:", j.stale);
                if (Array.isArray(j.data)) {
                  console.log("  data rows:", j.data.length);
                  if (j.data[0]) console.log("  row0 keys:", Object.keys(j.data[0]).join(", "));
                  if (j.data[0]) console.log("  row0:", JSON.stringify(j.data[0]).slice(0,400));
                  const weeks=[...new Set(j.data.map(r=>r.week_end||r.week_end_date||r.date).filter(Boolean))].sort();
                  console.log("  newest week_end:", weeks[weeks.length-1], "| oldest:", weeks[0], "| distinct:", weeks.length);
                }
              }
            '
          }
          probe vutn-jzwm 3   "edVisits  — NSSP Emergency Department Visits"
          probe f3zz-zga5 3   "ari       — Acute Respiratory Illness Activity Level"
          probe atcp-73re 3   "wastewater— NWSS Wastewater Viral Activity Level"
          echo "==================================================================="
          echo "### root, for orientation"
          curl -sS -o /tmp/root.txt -w "HTTP %{http_code} | %{content_type} | %{size_download} bytes\n" --max-time 30 "https://ingest.oakandmain.dev/" || true
          head -c 400 /tmp/root.txt 2>/dev/null; echo
          echo "### CORS preflight-ish check (Origin: https://flufollower.com)"
          curl -sS -o /dev/null -D - -H 'Origin: https://flufollower.com' --max-time 30 \
            "$BASE/vutn-jzwm.json?\$limit=1&\$order=week_end+DESC" 2>&1 | grep -iE "^HTTP|access-control|content-type" | head -10
          exit 0
