name: CI

on:
  # Both branches that can ship, not just main. Cloudflare Pages builds
  # production from the repository default branch, which is NOT main, so a push
  # straight there used to run no build, no QA and no tests.
  #
  # Listed explicitly rather than left unfiltered: an unfiltered `push` fires a
  # second, identical run alongside `pull_request` for every branch that has a
  # PR open, doubling CI for no extra coverage. Feature branches are covered by
  # `pull_request`; these two are covered because a push to them deploys.
  #
  # Renaming the default branch means updating this list — it is the one place
  # in the tree that names a branch (see docs/PORT-FORWARD-PLAN.md and the
  # hygiene notes on PR #10).
  push:
    branches: [main, claude/respiratory-tracker-feasibility-sykoxq]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — FluTrack has zero runtime/build deps.
      # The sample-data fallback is what ships whenever the CDC feed is down,
      # so it is built and QA'd on every run, deterministically.
      - name: Build site (sample-data fallback)
        env:
          LIVE_PRERENDER: 'off'
        run: node build/build.mjs

      - name: QA — sample build
        run: node build/check.mjs

      # The default path production takes: live CDC pre-render, falling back to
      # sample if the feed is unreachable from the runner. check.mjs verifies
      # every badge matches whichever data was actually shipped.
      - name: Build site (live CDC pre-render)
        run: node build/build.mjs

      - name: QA — links, assets, SEO tags, provenance
        run: node build/check.mjs

      - name: Unit + integration tests
        run: node --test test/*.test.mjs
