name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — FluTrack has zero runtime/build deps.
      - name: Build site
        run: node build/build.mjs

      # The release gate runs here too, not only in CI. Deploying was previously
      # build-only, so the checks that block a bad release — dead links, missing
      # SEO tags, a dropped security header, an affiliate link that lost its
      # disclosure, a truncated icon — gated the CI run but not the thing that
      # actually publishes.
      - name: QA — links, assets, SEO tags
        run: node build/check.mjs

      - name: Unit + integration tests
        run: node --test test/*.test.mjs

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=flufollower
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
