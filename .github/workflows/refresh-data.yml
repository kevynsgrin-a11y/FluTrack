# Weekly (daily-attempt) live CDC data refresh.
#
# Regenerates src/data/snapshot.json from the real CDC datasets, runs the full
# verify, and proposes the result as a DRAFT pull request. It deliberately does
# not push to main: the repository owner approves every merge.
#
# Why a committed snapshot rather than a fetch during the page build: the build
# stays offline and deterministic, the data that shipped is auditable in git
# history, and a bad upstream week can never half-build the site.
#
# Runs daily because the gate is cheap and a missed Friday would otherwise leave
# the site a week stale. On a day with no new upstream week the regenerated file
# is identical, there is no diff, and the job exits without touching the PR.
name: Refresh CDC data

on:
  schedule:
    # 13:00 UTC daily. CDC surveillance publishes on Fridays; running every day
    # means a publication delay or a failed run self-heals the next morning.
    - cron: '0 13 * * *'
  workflow_dispatch:

concurrency:
  group: refresh-cdc-data
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: data/weekly-refresh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # No dependencies to install — FluTrack has zero runtime/build deps.

      - name: Regenerate the snapshot from live CDC data
        id: refresh
        run: |
          # Exits non-zero and leaves the file untouched when the refresh does
          # not clear the MIN_LIVE_STATES / ISO-week / staleness gate.
          npm run snapshot:live

      - name: Verify the refreshed site builds and passes every gate
        run: npm run verify

      - name: Stop if the data did not change
        id: diff
        run: |
          if git diff --quiet -- src/data/snapshot.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream change — snapshot is byte-identical. Nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            node -e "
              const s = require('./src/data/snapshot.json');
              const filled = Object.values(s.states).filter(x => x.ariLevel != null || x.edCombinedSeries.length).length;
              console.log(\`week=\${s.weekEnding} kind=\${s.kind} filled=\${filled}/\${Object.keys(s.states).length}\`);
            " >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open or update the draft pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WEEK=$(node -p "require('./src/data/snapshot.json').weekEnding")
          KIND=$(node -p "require('./src/data/snapshot.json').kind")
          FILLED=$(node -p "const s=require('./src/data/snapshot.json');Object.values(s.states).filter(x=>x.ariLevel!=null||x.edCombinedSeries.length).length")
          TOTAL=$(node -p "Object.keys(require('./src/data/snapshot.json').states).length")

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # One long-lived branch, so the PR updates in place instead of a new
          # pull request accumulating every week.
          git checkout -B "$BRANCH"
          git add src/data/snapshot.json
          git commit -m "data: refresh CDC snapshot to week ending ${WEEK}

          kind=${KIND}, ${FILLED}/${TOTAL} states carrying upstream values.
          Generated by .github/workflows/refresh-data.yml via npm run snapshot:live.
          npm run verify passed before this commit was proposed."
          # The branch is bot-owned and recreated from main on every run, so a
          # force push is the correct semantic. --force-with-lease cannot be
          # used here: it fails on the very first push, when no remote ref exists.
          git push --force origin "$BRANCH"

          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --draft --base main --head "$BRANCH" \
              --title "data: refresh CDC snapshot (week ending ${WEEK})" \
              --body "Automated live CDC data refresh.

          | | |
          |---|---|
          | Week ending | \`${WEEK}\` |
          | Snapshot kind | \`${KIND}\` |
          | States carrying upstream values | ${FILLED} / ${TOTAL} |

          \`npm run verify\` passed on this snapshot before the pull request was opened or updated: the site builds, every QA gate is green, and the data-freshness ceiling is satisfied.

          A refresh that does not clear the gate in \`fetchLiveSignals\` (fewer than 25 of 51 states carrying a usable value, a missing ISO week-ending date, or a stale ingest envelope) fails the job and leaves \`src/data/snapshot.json\` untouched, so this pull request can only ever carry data that passed.

          Opened as a draft and never merged automatically.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          else
            echo "PR already open for $BRANCH — force-pushed the new snapshot to it."
          fi
